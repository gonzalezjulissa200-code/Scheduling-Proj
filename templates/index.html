<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Webpage</title>
    <style>
        .schedule-header,
        .schedule-row {
            display: grid;
            grid-template-columns: 80px repeat(7, 1fr);
        }

        .schedule-header div {
            text-align: center;
            font-weight: bold;
            padding: 10px;
            border-bottom: 1px solid black;
        }

        .schedule-row > div {
            min-height: 50px;
            border-bottom: 1px solid #aaa;
            border-right: 1px solid #aaa;
        }

        .schedule-time {
            text-align: right;
            padding-right: 10px;
        }
    </style>
</head>
<body>
    <h1>Schedule Builder</h1>
    <p>Open Buisness Hours</p>
    <table>
        {% for day, hours in business_hours.items() %}
        <tr>
            <td>{{ day }}</td>

            <td>
                <input type="time"
                    class="business-time"
                    data-day="{{ day }}"
                    data-field="open"
                    value="{{ hours['open'] }}">
            </td>

            <td>
                <input type="time"
                    class="business-time"
                    data-day="{{ day }}"
                    data-field="close"
                    value="{{ hours['close'] }}">
            </td>
        </tr>
        {% endfor %}
    </table>

    <h2>Weekly Schedule</h2>

    <div class="schedule">
        <div class="schedule-header">
            <div class="time-header"></div>
            <div>MON</div>
            <div>TUE</div>
            <div>WED</div>
            <div>THU</div>
            <div>FRI</div>
            <div>SAT</div>
            <div>SUN</div>
        </div>

        <div id="schedule-body"></div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
