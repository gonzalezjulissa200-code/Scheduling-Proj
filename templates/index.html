<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Schedule Builder</title>

    <style>
        .top-layout {
        display: flex;
        align-items: flex-start;
        gap: 40px;

        width: 95%;
    }

    .business-hours-section {
        width: 330px;
        flex-shrink: 0;
    }

    .schedule-section {
        flex: 1;
        max-width: 1100px;
    }

    .schedule {
        width: 100%;
        font-size: 14px;
    }

    .schedule-header,
    .schedule-row {
        display: grid;
        grid-template-columns: 55px repeat(7, 1fr);
    }

    .schedule-header div {
        text-align: center;
        font-weight: bold;
        padding: 8px 5px;
        border-bottom: 1px solid black;
    }

    .schedule-row > div {
        min-height: 30px;
        border-bottom: 1px solid #aaa;
        border-right: 1px solid #aaa;
    }

    .schedule-time {
        text-align: right;
        padding-right: 7px;
        padding-top: 5px;
    }

    #PopUP_shifts {
        position: fixed;
        top: 350px;
        left: 110px;

        grid-template-columns: 1fr 1fr;
        gap: 15px;

        padding: 20px;
        background: white;
        border: 1px solid #aaa;
        border-radius: 8px;
    }

    #PopUP_shifts.hidden {
        display: none;
    }

    #PopUP_shifts:not(.hidden) {
        display: grid;
    }

    #PopUP_shifts table {
        grid-column: 1 / 3;
    }

    #finish_shift {
        grid-column: 1;
    }

    #disregard_shift {
        grid-column: 2;
    }

    </style>

</head>


<body>

    <h1>Schedule Builder</h1>


    <div class="top-layout">

        <div class="business-hours-section">

            <p>Open Business Hours</p>

            <table>

                {% for day, hours in business_hours.items() %}

                <tr>

                    <td>
                        {{ day }}
                    </td>

                    <td>
                        <input
                            type="time"
                            class="business-time"
                            data-day="{{ day }}"
                            data-field="open"
                            value="{{ hours['open'] }}"
                        >
                    </td>

                    <td>
                        <input
                            type="time"
                            class="business-time"
                            data-day="{{ day }}"
                            data-field="close"
                            value="{{ hours['close'] }}"
                        >
                    </td>

                </tr>

                {% endfor %}

            </table>

            <div style="margin-top: 32px; text-align: left;">
                <button id="shiftadding_button" type="button">Add Shift</button>
            </div>

        </div>

        <div id="PopUP_shifts" class = "hidden">
            <table>
                <tr>
                    <td>
                        <input
                            type="time"
                            class="shiftDate"
                            data-field="start"
                        >
                    </td>
                </tr>

                <tr>
                    <td>
                        <input
                            type="time"
                            class="shiftDate"
                            data-field="end"
                        >
                    </td>
                </tr>
                   
                <tr>
                    <td>
                        <select class = "shiftDate" data-field="day">
                                <option>Monday</option>
                                <option>Tuesday</option>
                                <option>Wednesday</option>
                                <option>Thursday</option>
                                <option>Friday</option>
                                <option>Saturday</option>
                                <option>Sunday</option>
                        </select>
                    </td>
                </tr>
            </table>

            <button id="finish_shift" type="button">Create Shift</button>
            <button id="disregard_shift" type="button">Cancel</button>
        </div>

        <div class="schedule-section">

            <h2>Weekly Schedule</h2>

            <div class="schedule">

                <div class="schedule-header">

                    <div></div>

                    <div>MON</div>
                    <div>TUE</div>
                    <div>WED</div>
                    <div>THU</div>
                    <div>FRI</div>
                    <div>SAT</div>
                    <div>SUN</div>

                </div>


                <div id="schedule-body"></div>

            </div>

        </div>

    </div>


    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script src="{{ url_for('static', filename='shiftscreate.js') }}"></script>

</body>

</html>
